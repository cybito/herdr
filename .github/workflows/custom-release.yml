name: Custom release
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'cybito/herdr' && !github.event.release.draft
    runs-on: ubuntu-24.04-arm
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run GitHub Release asset seam tests
        run: python3 .github/scripts/package-release.py self-test
      - name: Validate release identity and custom ancestry
        id: release
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/custom:refs/remotes/origin/custom
          python3 - <<'PY'
          import json, os, runpy
          helper = runpy.run_path('.github/scripts/package-release.py')
          with open(os.environ['GITHUB_EVENT_PATH']) as f: event = json.load(f)
          result = helper['validate_event'](event, os.environ['EXPECTED_REPOSITORY'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for key, value in result.items(): f.write(f'{key}={value}\\n')
          PY
  build:
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            runner: macos-26
            target: aarch64-apple-darwin
          - platform: linux
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    concurrency:
      group: herdr-${{ needs.validate.outputs.tag }}-${{ matrix.platform }}-arm64
      cancel-in-progress: false
    env:
      PLATFORM: ${{ matrix.platform }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      SOURCE_SHA: ${{ needs.validate.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check existing GitHub Release asset set
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/package-release.py check --tag "$RELEASE_TAG" --commit "$SOURCE_SHA" --platform "$PLATFORM" --output-dir "$RUNNER_TEMP/existing-package" > "$RUNNER_TEMP/existing.json"
          python3 - <<'PY'
          import json, os
          result = json.load(open(os.environ['RUNNER_TEMP'] + '/existing.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write('exists=' + str(result['exists']).lower() + '\n')
          if result['exists']:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f: f.write('Reused verified GitHub Release assets: ' + result['reference'] + '\n')
          PY
      - name: Install native build dependencies
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -euo pipefail
          if [[ "$PLATFORM" == linux ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config
          else
            command -v cmake
            command -v ninja
          fi
      - name: Install exact Rust and checksum-pinned Zig
        if: steps.existing.outputs.exists != 'true'
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-home
          RUSTUP_HOME: ${{ runner.temp }}/rustup-home
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.1 --profile minimal
          rustup target add --toolchain 1.96.1 "${{ matrix.target }}"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile, urllib.request
          platform = 'macos' if os.environ['PLATFORM'] == 'darwin' else 'linux'
          expected = {'macos': 'b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489', 'linux': 'ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17'}[platform]
          official = json.load(urllib.request.urlopen('https://ziglang.org/download/index.json'))['0.16.0'][f'aarch64-{platform}']
          assert official['shasum'] == expected
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'zig.tar.xz'
          archive.write_bytes(urllib.request.urlopen(official['tarball']).read())
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected
          with tarfile.open(archive) as tar: tar.extractall(os.environ['RUNNER_TEMP'], filter='data')
          with open(os.environ['GITHUB_PATH'], 'a') as f: f.write(os.environ['RUNNER_TEMP'] + f'/zig-aarch64-{platform}-0.16.0\n')
          PY
      - name: Build and native smoke
        if: steps.existing.outputs.exists != 'true'
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-home
          RUSTUP_HOME: ${{ runner.temp }}/rustup-home
        run: bash .github/scripts/custom-release.sh build "$PLATFORM" "$RELEASE_TAG" "$SOURCE_SHA" "$RUNNER_TEMP/herdr-build"
      - name: Package and exercise isolated install smoke
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -euo pipefail
          python3 .github/scripts/package-release.py pack --tag "$RELEASE_TAG" --commit "$SOURCE_SHA" --platform "$PLATFORM" --input-dir "$RUNNER_TEMP/herdr-build" --output-dir "$RUNNER_TEMP/herdr-package"
          bash .github/scripts/custom-release.sh smoke "$PLATFORM" "$RELEASE_TAG" "$SOURCE_SHA" "$RUNNER_TEMP/herdr-package"
      - name: Upload without overwrite and verify downloaded assets
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/package-release.py publish --directory "$RUNNER_TEMP/herdr-package"
  summarize:
    needs: [validate, build]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    concurrency:
      group: herdr-${{ needs.validate.outputs.tag }}-notes
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      SOURCE_SHA: ${{ needs.validate.outputs.commit }}
      RELEASE_ID: ${{ github.event.release.id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify both platforms and update managed release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request
          tag, source = os.environ['RELEASE_TAG'], os.environ['SOURCE_SHA']
          rows = []
          for platform in ('darwin', 'linux'):
              result = json.loads(subprocess.check_output(['python3', '.github/scripts/package-release.py', 'check', '--tag', tag, '--commit', source, '--platform', platform, '--output-dir', os.environ['RUNNER_TEMP'] + '/summary-' + platform], text=True))
              assert result['exists'], 'both platform asset sets are required'
              links = ''.join(f'- [{name}](https://github.com/cybito/herdr/releases/download/{tag}/{name})\n' for name in result['assets'])
              rows.append((platform, links))
          release_id = os.environ['RELEASE_ID']; assert re.fullmatch(r'[0-9]+', release_id)
          url = 'https://api.github.com/repos/cybito/herdr/releases/' + release_id
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          release = json.load(urllib.request.urlopen(urllib.request.Request(url, headers=headers))); assert release['tag_name'] == tag
          start, end = '<!-- custom-builds:start -->', '<!-- custom-builds:end -->'; body = release.get('body') or ''
          assert body.count(start) == body.count(end) and body.count(start) <= 1, 'ambiguous managed notes block'
          block = start + '\n## Custom ARM64 builds\n\nSource: `https://github.com/cybito/herdr.git` at `' + source + '`; release `' + tag + '`.\n\n'
          block += 'darwin-arm64 assets:\n' + rows[0][1] + '\nlinux-arm64 assets:\n' + rows[1][1] + '\nVerify downloaded files with `SHA256SUMS`.\n\n[Installation](https://github.com/cybito/herdr/blob/' + source + '/docs/CUSTOM_RELEASE.md).\n' + end
          if start in body:
              left, right = body.index(start), body.index(end); assert right > left
              body = body[:left] + block + body[right + len(end):]
          else: body = body + ('\n\n' if body else '') + block
          request = urllib.request.Request(url, headers={**headers, 'Content-Type': 'application/json'}, data=json.dumps({'body': body}).encode(), method='PATCH')
          urllib.request.urlopen(request).read()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f: f.write(block + '\n')
          PY
